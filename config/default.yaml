# config/default.yaml
system:
  environment: "production" # oder "development"
  log_level: "INFO"
  base_dir: "C:\\OfflineAI"
  audit_logging: true

kernel:
  strict_mode: true # Bricht ab, wenn ein kritischer Provider fehlt


providers:
  ollama:
    enabled: true
    host: "127.0.0.1" # Bleibt strikt lokal!
    port: 11434

  open_webui:
    enabled: true
    host: "0.0.0.0"   # Macht das GUI im gesamten Unternehmensnetzwerk verfügbar
    port: 8080
    active_directory:
      enabled: true
      server: "ldap://dein-dc01.domain.local"
      base_dn: "DC=domain,DC=local"
      bind_dn: "CN=OfflineAI_Service,OU=ServiceAccounts,DC=domain,DC=local"
      bind_password: "sicheres_passwort" # Im produktiven System idealerweise verschlüsselt
      user_search_base: "OU=Users,DC=domain,DC=local"
