# config/default.yaml
system:
  environment: "production" # oder "development"
  log_level: "INFO"
  base_dir: "C:\\OfflineAI"
  audit_logging: true

kernel:
  strict_mode: true # Bricht ab, wenn ein kritischer Provider fehlt


providers:
  ollama:
    enabled: true
    host: "127.0.0.1" # Bleibt strikt lokal!
    port: 11434

  open_webui:
    enabled: true
    host: "0.0.0.0"   # Macht das GUI im gesamten Unternehmensnetzwerk verfügbar
    port: 8080
    active_directory:
      enabled: true
      server: "ldap://dein-dc01.domain.local"
      base_dn: "DC=domain,DC=local"
      bind_dn: "CN=OfflineAI_Service,OU=ServiceAccounts,DC=domain,DC=local"
      bind_password: "sicheres_passwort" # Im produktiven System idealerweise verschlüsselt
      user_search_base: "OU=Users,DC=domain,DC=local"

# Das Embedding-Modell (übersetzt Text in Vektoren)
  embedding_model:
    url: "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx"
    target_path: "providers/rag/models/all-MiniLM-L6-v2/model.onnx"
    
  # Die Vektordatenbank (ChromaDB als Standalone-Binary oder Wheel)
  chromadb:
    url: "https://github.com/chroma-core/chroma/releases/download/0.4.22/chroma-windows-amd64.exe" 
    target_path: "providers/rag/chroma.exe"
