# config/default.yaml
system:
  environment: "production" # oder "development"
  log_level: "INFO"
  base_dir: "C:\\OfflineAI"
  audit_logging: true

kernel:
  strict_mode: true # Bricht ab, wenn ein kritischer Provider fehlt

providers:
  # Provider 1: Lokales LLM
  ollama:
    enabled: true
    version_required: "0.1.20"
    host: "127.0.0.1"
    port: 11434
    
  # Provider 2: Active Directory Anbindung
  active_directory:
    enabled: false # Kann per USB-Update später aktiviert werden
    domain: "offline.local"
    
  # Provider 3: Weboberfläche
  open_webui:
    enabled: true
    port: 8080
