[project]
name = "offlineai-core"
version = "0.1.0"
description = "OfflineAI Enterprise Core"
requires-python = ">=3.13"

dependencies = [
    "pydantic",
    "pyyaml",
    "rich",
    "typer",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
